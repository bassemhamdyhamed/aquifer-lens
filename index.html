<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aquifer Lens - groundwater trend detective for Saudi Arabia</title>
<meta name="description" content="NASA GRACE/GRACE-FO satellite data shows Saudi Arabia losing stored water since 2002, with statistical tests for each trend. NASA Space Apps Challenge 2026.">
<style>
:root{--ink:#251f21;--ink2:#585254;--rule:#eae9ea;--teal:#2f7f6b;--sand:#f4efec;--deep:#0c2a2f;--deep2:#13484a;--mint:#9fe6cf;--bg:#fbf9f7;--line:#8c8583;--focus:#1a5fd0;--r:16px;--sh:0 1px 2px rgba(12,42,47,.06),0 10px 32px rgba(12,42,47,.10)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;overflow-x:clip}
[dir=rtl] body{font-family:"Noto Sans Arabic","Segoe UI",Tahoma,system-ui,Arial,sans-serif;line-height:1.8}
main{max-width:880px;margin:0 auto;padding:0 20px 72px}
a{color:#1f6b59;text-underline-offset:3px}
.num{unicode-bidi:isolate;direction:ltr;display:inline-block}

/* Focus */
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* Buttons */
button{font:inherit;font-weight:600;min-height:44px;min-width:96px;padding:0 18px;border:1px solid var(--line);background:#fff;border-radius:999px;cursor:pointer;color:var(--ink);transition:background-color .2s,border-color .2s}
button:hover{border-color:var(--teal)}

/* Hero band (full-bleed inside main) */
.hero{position:relative;margin-inline:calc(50% - 50vw);padding:14px max(20px,calc(50vw - 420px)) 52px;color:#eef6f4;background:radial-gradient(110% 90% at 88% -10%,rgba(47,127,107,.6),transparent 60%),radial-gradient(70% 60% at 0% 110%,rgba(31,78,121,.45),transparent 65%),linear-gradient(165deg,var(--deep),var(--deep2))}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:1px;background:linear-gradient(90deg,transparent,rgba(159,230,207,.55),transparent)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--ink2);font-size:13px}
.hero .bar{color:rgba(238,246,244,.8)}
.hero button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.45);color:#fff}
.hero button:hover{background:rgba(255,255,255,.16)}
.hero :focus-visible{outline-color:#fff}
.hero a{color:var(--mint)}

/* Type */
h1{font:600 clamp(34px,6.6vw,54px)/1.08 Georgia,"Noto Naskh Arabic",serif;letter-spacing:-.015em;margin:40px 0 12px}
.hero h1{color:#fff}
h2{font:600 clamp(22px,3.6vw,28px)/1.25 Georgia,"Noto Naskh Arabic",serif;margin:4px 0 10px}
[dir=rtl] h1,[dir=rtl] h2{font-family:"Noto Naskh Arabic","Noto Sans Arabic",Tahoma,serif;letter-spacing:0;line-height:1.35}

.fact{color:var(--teal);font-weight:600;font-size:clamp(17px,2.4vw,20px);line-height:1.5;margin:0 0 12px;max-width:60ch}
.hero .fact{color:var(--mint)}
.intro{max-width:64ch;margin:0}
.hero .intro{color:#d3e5e1}
.label{margin:0;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
[dir=rtl] .label{letter-spacing:0;font-size:13px}
.cap{color:var(--ink2);font-size:14px;margin:8px 0}
section{margin-top:56px}

/* Explorer panel */
#explorer{position:relative;background:#fff;border:1px solid #e6e1de;border-radius:var(--r);box-shadow:var(--sh);padding:clamp(18px,4vw,32px)}
.hero+#explorer{margin-top:-28px}
#explorer::before{content:"";position:absolute;inset-block-start:-1px;inset-inline:-1px;height:4px;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(90deg,#1f4e79,#2aa66a,#c0392b)}
[dir=rtl] #explorer::before{background:linear-gradient(270deg,#1f4e79,#2aa66a,#c0392b)}

/* Selects */
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:18px 0 6px}
.ctl label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
select{-webkit-appearance:none;appearance:none;width:100%;min-height:46px;font:inherit;font-size:16px;font-weight:500;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding-block:0;padding-inline:18px 44px;cursor:pointer;background-color:#f7f5f3;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat;transition:border-color .2s,background-color .2s}
[dir=rtl] select{background-position:16px 50%,22px 50%}
select:hover{border-color:var(--teal);background-color:#fff}

/* Chips as toggle buttons */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 18px}
.chip{--c:var(--teal);position:relative;display:inline-flex;align-items:center;gap:10px;min-height:44px;padding-inline:14px 18px;border:1.5px solid var(--line);border-radius:999px;background:#fff;color:var(--ink2);font-size:15px;font-weight:600;cursor:pointer;-webkit-user-select:none;user-select:none;transition:background-color .2s,border-color .2s,color .2s}
.chip input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.chip .sw{flex:none;width:14px;height:14px;border-radius:50%;transition:opacity .2s,transform .2s}
.chip input:not(:checked)+.sw{opacity:.3;transform:scale(.8)}
.chip input:focus-visible+.sw{outline:3px solid var(--focus);outline-offset:3px}
.chip:has(input:checked){border-color:var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 10%,#fff)}
.chip:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.chip:hover{border-color:var(--c)}


/* Chart */
.chart{margin:4px 0 8px;padding:14px 10px 6px;border:1px solid #eee9e6;border-radius:12px;background:linear-gradient(#fdfcfb,#f6f4f1);overflow:hidden}
.chart svg{display:block;width:100%;height:auto;font-variant-numeric:tabular-nums;animation:fade .45s ease both}
#xtip{min-height:1.65em;font-variant-numeric:tabular-nums}

/* Stat cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.card{position:relative;background:#fff;border:1px solid #ece7e4;border-top:4px solid var(--c,var(--teal));border-radius:12px;padding:16px 18px 14px;box-shadow:0 1px 2px rgba(12,42,47,.05)}
.card .cn{font-size:13px;font-weight:600;color:var(--ink2)}
.card .cv{margin:6px 0 4px;font-size:clamp(28px,5vw,36px);font-weight:700;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
[dir=rtl] .card .cv{letter-spacing:0}
.card .cd{font-size:13px;line-height:1.5;color:var(--ink2)}

/* Notes */
.warn{background:var(--sand);border-inline-start:4px solid #b7791f;border-radius:10px;padding:14px 18px;margin-top:12px;font-size:15px}
.warn p{margin:0}.warn p+p{margin-top:8px}

/* Ranked rows */
.row{display:grid;grid-template-columns:32px 1fr auto;gap:4px 14px;align-items:baseline;padding:16px 0;border-top:1px solid var(--rule)}
.row:last-child{border-bottom:1px solid var(--rule)}
.row .n{align-self:start;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#e4f1ec;color:#1d5c4c;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.row .nm{font-weight:600}
.row .v{font-weight:700;color:var(--deep2);text-align:end;font-variant-numeric:tabular-nums}
.row .d{grid-column:2/-1;font-size:14px;color:var(--ink2)}

/* Figures, lists, footer */
figure{margin:22px 0}
img{display:block;max-width:100%;height:auto;border:1px solid var(--rule);border-radius:12px}
figcaption{margin-top:8px;font-size:13px;color:var(--ink2)}
ol{padding-inline-start:1.4em}li{margin:6px 0}li::marker{color:var(--teal);font-weight:700}
footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--rule);font-size:13px;color:var(--ink2)}


/* Motion */
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fx{animation:fade .35s ease both}

/* Mobile */
@media (max-width:560px){
.ctl{grid-template-columns:1fr}
#explorer{padding:20px 16px;border-radius:14px}
.hero{padding-bottom:44px}
.chip{flex:1 1 auto;justify-content:center}
.row{grid-template-columns:28px 1fr auto;gap:4px 10px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

#xmap{height:340px;border-radius:12px;overflow:hidden;border:1px solid var(--rule)}.legend{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:6px}.lg{display:inline-block;width:120px;height:10px;border-radius:5px}@media(max-width:560px){#xmap{height:260px}}
.card .cv{white-space:nowrap;font-size:22px}@media(min-width:900px){.card .cv{font-size:26px}}
.approx{background:#fff4d6;border-inline-start:4px solid #b7791f;border-radius:8px;padding:10px 14px;margin:8px 0;font-size:14px}
.tw{overflow-x:auto;margin:10px 0}table.rk{width:100%;border-collapse:collapse;font-size:14px}table.rk th,table.rk td{padding:9px 10px;border-bottom:1px solid var(--rule);text-align:start}table.rk th{font-size:12px;color:var(--ink2);font-weight:600}table.rk tr[data-i]{cursor:pointer}table.rk tr[data-i]:hover,table.rk tr[data-i]:focus-visible{background:#eef6f3;outline:none}table.rk tr.up td{color:#1d5f9c;font-weight:600}
@media(max-width:560px){table.rk th:nth-child(4),table.rk td:nth-child(4){display:none}}
.sats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:12px 0}.sat{border:1px solid var(--rule);border-radius:12px;padding:14px 16px;background:#fff;box-shadow:0 1px 2px rgba(12,42,47,.05)}.sat .cn{font-weight:700;font-size:16px;color:var(--deep,#0c2a2f)}.sat p{margin:6px 0 8px;font-size:14px;line-height:1.6}.sat a{font-size:13px;color:#1a5fd0}
