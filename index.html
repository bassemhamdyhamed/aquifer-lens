<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aquifer Lens - groundwater trend detective for Saudi Arabia</title>
<meta name="description" content="NASA GRACE/GRACE-FO satellite data shows Saudi Arabia losing stored water since 2002, with statistical tests for each trend. NASA Space Apps Challenge 2026.">
<style>
:root{--ink:#251f21;--ink2:#585254;--rule:#eae9ea;--teal:#2f7f6b;--sand:#f4efec}
*{box-sizing:border-box}
body{margin:0;background:#fffdfc;color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 20px 60px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--ink2);font-size:13px}
button{font:inherit;min-height:44px;min-width:96px;padding:0 16px;border:1px solid #cfc9c7;background:#fff;border-radius:6px;cursor:pointer;color:var(--ink)}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1{font:600 clamp(30px,6vw,46px)/1.15 Georgia,"Noto Naskh Arabic",serif;margin:28px 0 8px;letter-spacing:-.02em}
.fact{color:var(--teal);font-weight:600;font-size:18px;margin:0 0 16px}
.intro{font-size:17px}
h2{font:600 24px/1.3 Georgia,"Noto Naskh Arabic",serif;margin:0 0 6px}
section{margin-top:44px}
.label{color:var(--ink2);font-size:13px;margin:0 0 2px}
.cap{color:var(--ink2);font-size:13px;line-height:1.5;margin:6px 0 14px}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:4px 12px;padding:14px 0;border-top:1px solid var(--rule)}
.row:last-of-type{border-bottom:1px solid var(--rule)}
.row .n{color:var(--ink2)}.row .nm{font-weight:600}.row .d{color:var(--ink2);font-size:14px;grid-column:2}
.row .v{font-weight:600;color:var(--teal);white-space:nowrap;grid-row:1;grid-column:3}
.row .nm{grid-column:2}
@media(max-width:560px){.row{grid-template-columns:24px 1fr}.row .v{grid-column:2;grid-row:auto}}
figure{margin:18px 0}img{max-width:100%;height:auto;display:block;border:1px solid var(--rule);border-radius:6px;background:#fff}
figcaption{color:var(--ink2);font-size:13px;margin-top:6px}
ol{padding-inline-start:22px}li{margin:6px 0}
.warn{background:var(--sand);border-radius:10px;padding:16px 20px}.warn h3{margin:0 0 6px;font-size:16px}
.num{unicode-bidi:isolate;direction:ltr;display:inline-block}
footer{margin-top:50px;border-top:1px solid var(--rule);padding-top:16px;color:var(--ink2);font-size:13px}
[dir=rtl] .row .v{text-align:left}
</style></head><body><main id="app"></main><script src="img1.js"></script><script src="img2.js"></script>
<script>
const T={"en":{"title":"Aquifer Lens","fact":"Saudi Arabia is losing stored water, and the trend is real","intro":"NASA GRACE and GRACE-FO satellites weigh the water stored under the ground. Aquifer Lens reads 24 years of that record (April 2002 to September 2026), removes the seasons and tests whether each trend is statistically real.","challenge":"NASA Space Apps Challenge 2026: Be An Earth System Trend Detective","langBtn":"العربية","gQ":"The question","qP":"Is a desert region gaining or losing water, and is the trend real or just noise? Groundwater is hard to see from the surface. Satellite gravity data shows change in total water storage month by month, with no well-by-well survey.","gR":"What we found","gRsub":"Sen slope of total water storage, April 2002 to September 2026, 261 months","unit":"cm of water per year","regions":[{"name":"Saq / Disi aquifer","slope":"-1.29","ci":"-1.33 to -1.26","p":"5.5e-8"},{"name":"Wadi As-Sirhan","slope":"-1.08","ci":"-1.11 to -1.05","p":"7.2e-9"},{"name":"Saudi Arabia analysis box","slope":"-0.73","ci":"-0.75 to -0.71","p":"2.4e-10"},{"name":"Al-Ahsa","slope":"-0.67","ci":"-0.69 to -0.66","p":"2.1e-10"}],"ciLbl":"95% CI","pLbl":"Autocorrelation-corrected p","allSig":"All four regions decline significantly (Mann-Kendall p < 0.001, and still significant after correcting for autocorrelation).","gKey":"Key results","keys":[{"name":"Saq / Disi lost about 22 cm of water","detail":"Net change since 2002, seasonally adjusted: mean of the last 12 months minus the first 12.","value":"-22 cm"},{"name":"The Saq / Disi loss slowed after 2016","detail":"2002-2016: -1.41 cm/yr (CI -1.46 to -1.36). 2018-2026: -0.54 cm/yr (CI -0.59 to -0.46). The intervals do not overlap. Each period comes from a single satellite mission, so a mission offset cannot explain it.","value":"-1.41 to -0.54"},{"name":"A volume sense of scale","detail":"The Saudi analysis box covers about 3.9 million km2. At the Sen rate that is about 28 km3 of water per year. The box extends beyond the border, so this is a derived estimate, not a national figure.","value":"-28 km3/yr"},{"name":"One area is gaining","detail":"10 grid cells in the south-western highlands (16-20 N, 42-46 E) show a significant increase, which survives a Benjamini-Hochberg correction (5% false discovery rate, 1,520 land cells tested). The region as a whole still declines.","value":"+10 cells"}],"gCharts":"Charts","chartsNote":"Top: monthly total water storage. Bottom: seasonal cycle removed, with the fitted trend. Generated by the notebook from NASA data.","charts":[{"src":"saq","alt":"Time series of total water storage for the Saq / Disi aquifer with a declining trend line","t":"Saq / Disi aquifer"},{"src":"sirhan","alt":"Time series of total water storage for Wadi As-Sirhan with a declining trend line","t":"Wadi As-Sirhan"},{"src":"ahsa","alt":"Time series of total water storage for Al-Ahsa with a declining trend line","t":"Al-Ahsa"},{"src":"ksa","alt":"Time series of total water storage for the Saudi Arabia analysis box with a declining trend line","t":"Saudi Arabia analysis box"}],"gMap":"Trend map","mapAlt":"Map of trend in total water storage per grid cell over the Arabian Peninsula, land only","mapCap":"Trend per grid cell over the Arabian Peninsula, land only (cm per year).","gM":"How it works","steps":["Download the monthly GRACE and GRACE-FO mascon grid from NASA PO.DAAC.","Take the area-weighted mean over the chosen region (preset or your own latitude and longitude box).","Remove the seasonal cycle with a monthly climatology.","Test the trend with Mann-Kendall and measure it with Sen's slope, with OLS and Hamed-Rao autocorrelation-corrected checks.","Map the trend for every grid cell, and correct the map for multiple testing."],"gD":"NASA data used","data":[{"label":"Main dataset","value":"JPL GRACE and GRACE-FO Mascon, water height (RL06.3 v04), NASA PO.DAAC. April 2002 to September 2026."},{"label":"Demo dataset","value":"GISS Surface Temperature Analysis (GISTEMP v4), NASA GISS. The same method on a no-login example."}],"gC":"Limits","caveat":"What this does not show","caveats":["GRACE measures total water storage: groundwater plus soil water and surface water. A decline is consistent with aquifer loss, but this analysis does not separate groundwater from the other parts.","Mascon grid cells are coarse (hundreds of kilometres), so small oases and single wells are not resolved.","The data has a gap between the GRACE and GRACE-FO missions (2017 to 2018). The 2016 split in the slowdown result follows that gap; it was not detected from the data."],"gRun":"Run it yourself","run":"Open Aquifer_Lens.ipynb in Google Colab and choose Runtime, then Run all. A free NASA Earthdata login is needed for the GRACE download. Every number on this page is reproduced by the notebook.","close":"Built for NASA Space Apps Challenge 2026 with AI coding assistance. All analysis uses real NASA data: GRACE/GRACE-FO (PO.DAAC) and GISTEMP (GISS)."},"ar":{"title":"عدسة المياه الجوفية (Aquifer Lens)","fact":"السعودية تفقد مخزونها من المياه، والاتجاه حقيقي","intro":"أقمار ناسا GRACE وGRACE-FO تزن المياه المخزنة تحت الأرض. تقرأ Aquifer Lens 24 عامًا من هذا السجل (من أبريل 2002 إلى سبتمبر 2026)، وتزيل أثر الفصول، وتختبر هل كل اتجاه حقيقي إحصائيًا.","challenge":"تحدي ناسا سبيس آبس 2026: كن محقق اتجاهات نظام الأرض","langBtn":"English","gQ":"السؤال","qP":"هل تكسب منطقة صحراوية مياهًا أم تفقدها، وهل الاتجاه حقيقي أم مجرد ضجيج؟ يصعب رؤية المياه الجوفية من السطح. بيانات الجاذبية من الأقمار تُظهر تغيّر إجمالي المياه المخزنة شهرًا بشهر، دون مسح بئر بئر.","gR":"ماذا وجدنا","gRsub":"ميل سين لإجمالي المياه المخزنة، من أبريل 2002 إلى سبتمبر 2026 (261 شهرًا). القيم المعروضة هي مقدار الانخفاض","unit":"سم من الماء في السنة","regions":[{"name":"خزان الساق / الديسي","slope":"1.29","ci":"1.26 إلى 1.33","p":"5.5e-8"},{"name":"وادي السرحان","slope":"1.08","ci":"1.05 إلى 1.11","p":"7.2e-9"},{"name":"نطاق التحليل للسعودية","slope":"0.73","ci":"0.71 إلى 0.75","p":"2.4e-10"},{"name":"الأحساء","slope":"0.67","ci":"0.66 إلى 0.69","p":"2.1e-10"}],"ciLbl":"فاصل الثقة 95٪ للانخفاض","pLbl":"قيمة p بعد تصحيح الارتباط الذاتي","allSig":"المناطق الأربع كلها تتراجع بدلالة إحصائية (مان-كيندال p < 0.001، وتبقى دالة بعد تصحيح الارتباط الذاتي).","gKey":"أهم النتائج","keys":[{"name":"فقد الساق / الديسي نحو 22 سم من الماء","detail":"صافي التغيّر منذ 2002 بعد إزالة الموسمية: متوسط آخر 12 شهرًا ناقص أول 12 شهرًا.","value":"22 سم"},{"name":"تباطأ فقد الساق / الديسي بعد 2016","detail":"2002-2016: 1.41 سم/سنة (فاصل الثقة 1.36 إلى 1.46). 2018-2026: 0.54 سم/سنة (0.46 إلى 0.59). الفاصلان لا يتداخلان. كل فترة من مهمة قمر واحدة، فلا يفسّر فرق المهمتين هذا التباطؤ.","value":"0.54 إلى 1.41"},{"name":"فكرة عن الحجم","detail":"يغطي نطاق التحليل السعودي نحو 3.9 مليون كم². بمعدل سين يعادل ذلك نحو 28 كم³ من الماء سنويًا. النطاق يمتد خارج الحدود، لذا هذا تقدير مشتق وليس رقمًا وطنيًا.","value":"28 كم³/سنة"},{"name":"منطقة واحدة تكسب مياهًا","detail":"10 خلايا شبكية في المرتفعات الجنوبية الغربية (16-20 شمالًا، 42-46 شرقًا) تُظهر زيادة دالة، وتصمد بعد تصحيح بنجاميني-هوشبرج (معدل اكتشاف خاطئ 5٪، 1,520 خلية يابسة مختبرة). المنطقة ككل ما زالت تتراجع.","value":"10 خلايا"}],"gCharts":"الرسوم","chartsNote":"الأعلى: إجمالي المياه المخزنة شهريًا. الأسفل: بعد إزالة الدورة الموسمية مع خط الاتجاه. أنتجها الدفتر من بيانات ناسا (عناوين الرسوم بالإنجليزية).","charts":[{"src":"saq","alt":"سلسلة زمنية لإجمالي المياه المخزنة في خزان الساق / الديسي مع خط اتجاه هابط","t":"خزان الساق / الديسي"},{"src":"sirhan","alt":"سلسلة زمنية لإجمالي المياه المخزنة في وادي السرحان مع خط اتجاه هابط","t":"وادي السرحان"},{"src":"ahsa","alt":"سلسلة زمنية لإجمالي المياه المخزنة في الأحساء مع خط اتجاه هابط","t":"الأحساء"},{"src":"ksa","alt":"سلسلة زمنية لإجمالي المياه المخزنة في نطاق التحليل للسعودية مع خط اتجاه هابط","t":"نطاق التحليل للسعودية"}],"gMap":"خريطة الاتجاه","mapAlt":"خريطة اتجاه إجمالي المياه المخزنة لكل خلية شبكية فوق شبه الجزيرة العربية، اليابسة فقط","mapCap":"الاتجاه لكل خلية شبكية فوق شبه الجزيرة العربية، اليابسة فقط (سم في السنة).","gM":"كيف تعمل","steps":["تنزيل شبكة GRACE وGRACE-FO الشهرية (mascon) من NASA PO.DAAC.","أخذ المتوسط الموزون بالمساحة للمنطقة المختارة (منطقة جاهزة أو مربع خطوط الطول والعرض الذي تحدده).","إزالة الدورة الموسمية بمتوسط شهري.","اختبار الاتجاه بمان-كيندال وقياسه بميل سين، مع فحوص OLS وهامد-راو لتصحيح الارتباط الذاتي.","رسم الاتجاه لكل خلية شبكية، مع تصحيح الخريطة للاختبارات المتعددة."],"gD":"بيانات ناسا المستخدمة","data":[{"label":"المجموعة الرئيسية","value":"JPL GRACE وGRACE-FO Mascon، ارتفاع الماء (RL06.3 v04)، NASA PO.DAAC. من أبريل 2002 إلى سبتمبر 2026."},{"label":"مجموعة العرض","value":"تحليل درجة حرارة السطح GISTEMP v4 من NASA GISS. الطريقة نفسها على مثال لا يحتاج تسجيل دخول."}],"gC":"الحدود","caveat":"ما لا يُظهره هذا العمل","caveats":["يقيس GRACE إجمالي المياه المخزنة: المياه الجوفية مع رطوبة التربة والمياه السطحية. التراجع يتوافق مع فقد الخزانات، لكن هذا التحليل لا يفصل المياه الجوفية عن بقية المكونات.","خلايا الشبكة خشنة (مئات الكيلومترات)، فلا تظهر الواحات الصغيرة ولا الآبار المفردة.","في البيانات فجوة بين مهمتي GRACE وGRACE-FO (2017 إلى 2018). تقسيم 2016 في نتيجة التباطؤ يتبع هذه الفجوة، ولم يُكتشف من البيانات."],"gRun":"شغّله بنفسك","run":"افتح Aquifer_Lens.ipynb في Google Colab ثم اختر Runtime ثم Run all. تحتاج حساب NASA Earthdata مجانيًا لتنزيل بيانات GRACE. كل رقم في هذه الصفحة يعيد الدفتر إنتاجه.","close":"أُنجز لتحدي ناسا سبيس آبس 2026 بمساعدة أدوات برمجة بالذكاء الاصطناعي. كل التحليل على بيانات ناسا الحقيقية: GRACE/GRACE-FO (PO.DAAC) وGISTEMP (GISS)."}}
;
const imgs=window.IM||{};
const NUM=/(\d[\d.,]*-\d[\d.,]*|[-+]?\d[\d.,]*(?:e-?\d+)?)/g;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const f=s=>esc(s).split(NUM).map((x,i)=>i%2?'<span class="num">'+x+'</span>':x).join('');
function render(lang){
 const t=T[lang],ar=lang==='ar';
 document.documentElement.lang=lang;document.documentElement.dir=ar?'rtl':'ltr';
 document.title=ar?'عدسة المياه الجوفية (Aquifer Lens)':'Aquifer Lens - groundwater trend detective for Saudi Arabia';
 const L=(a,b)=>ar?a:b;
 let h=`<div class="bar"><span>${esc(t.challenge)}</span><button id="lang" type="button" aria-label="${ar?'Switch to English':'التبديل إلى العربية'}">${esc(t.langBtn)}</button></div>
 <h1>${esc(t.title)}</h1><p class="fact">${esc(t.fact)}</p><p class="intro">${f(t.intro)}</p>
 <section><p class="label">${esc(t.gQ)}</p><p>${f(t.qP)}</p></section>
 <section><p class="label">${L('النتائج','Results')}</p><h2>${esc(t.gR)}</h2><p class="cap">${f(t.gRsub)}</p>`;
 t.regions.forEach((r,i)=>{h+=`<div class="row"><span class="n">${i+1}.</span><span class="nm">${esc(r.name)}</span><span class="v">${f(r.slope+' '+L('سم/سنة','cm/yr'))}</span><span class="d">${esc(t.ciLbl)}: ${f(r.ci)}<br>${esc(t.pLbl)}: ${f(r.p)}</span></div>`});
 h+=`<p class="cap">${esc(t.unit)}. ${f(t.allSig)}</p></section>
 <section><p class="label">${L('الخلاصة','Summary')}</p><h2>${esc(t.gKey)}</h2>`;
 t.keys.forEach((k,i)=>{h+=`<div class="row"><span class="n">${i+1}.</span><span class="nm">${f(k.name)}</span><span class="v">${f(k.value)}</span><span class="d">${f(k.detail)}</span></div>`});
 h+=`</section><section><p class="label">${L('الخريطة','Map')}</p><h2>${esc(t.gMap)}</h2><figure><img src="${imgs.map}" alt="${esc(t.mapAlt)}"><figcaption>${esc(t.mapCap)}</figcaption></figure></section>
 <section><p class="label">${L('السلاسل الزمنية','Time series')}</p><h2>${esc(t.gCharts)}</h2><p class="cap">${f(t.chartsNote)}</p>`;
 t.charts.forEach(c=>{h+=`<figure><img src="${imgs[c.src]}" alt="${esc(c.alt)}" loading="lazy"><figcaption>${esc(c.t)}</figcaption></figure>`});
 h+=`</section><section><p class="label">${L('المنهج','Method')}</p><h2>${esc(t.gM)}</h2><ol>${t.steps.map(s=>'<li>'+f(s)+'</li>').join('')}</ol></section>
 <section><p class="label">${L('المصادر','Sources')}</p><h2>${esc(t.gD)}</h2>${t.data.map(d=>`<p><strong>${esc(d.label)}</strong><br>${f(d.value)}</p>`).join('')}</section>
 <section><p class="label">${L('الشفافية','Transparency')}</p><h2>${esc(t.gC)}</h2><div class="warn"><h3>${esc(t.caveat)}</h3><ul>${t.caveats.map(s=>'<li>'+f(s)+'</li>').join('')}</ul></div></section>
 <section><p class="label">${L('التشغيل','Reproduce')}</p><h2>${esc(t.gRun)}</h2><p>${f(t.run)}</p></section>
 <footer>${f(t.close)}</footer>`;
 document.getElementById('app').innerHTML=h;
 document.getElementById('lang').onclick=()=>{const n=ar?'en':'ar';try{localStorage.setItem('lang',n)}catch(e){}history.replaceState(null,'','#'+n);render(n);window.scrollTo(0,0)};
}
let l='en';try{l=localStorage.getItem('lang')||'en'}catch(e){}
if(location.hash==='#ar')l='ar';if(location.hash==='#en')l='en';
render(l);
</script></body></html>
